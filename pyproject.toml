[project]
name = "infer-opt"
version = "0.1.0"
description = "Decoder-only Transformer inference optimization research template"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
notebooks = [
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]

[project.scripts]
infer-opt = "infer_opt.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
